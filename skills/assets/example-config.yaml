# etunl client config — annotated example
# Place at ~/.etunl/config.yaml (mode 0600)
#
# Generated by `etunl init --mode client --server <addr> <token>`.
# All edits are hot-reloaded by the fsnotify watcher in the client.

# --------------------------------------------------------------------------
# Connection
# --------------------------------------------------------------------------

# Host (and optional port) of the etunl server. WebSocket URL becomes
# ws://<server>/tunnel — TLS termination is expected to happen in front
# of the server (e.g. Cloudflare). No scheme, no path.
server: tunnel.example.com

# Bearer token. MUST equal the server's `token` (in ~/.etunl/server.yaml).
# Treat as a secret. File mode is 0600 for this reason.
token: "replace-with-a-long-hex-secret"

# Name this client identifies as on the server. Used for route ownership
# tracking. If omitted, os.Hostname() is used. Two clients with the same
# machine_name will fight — the newer one wins and the older is dropped.
machine_name: homelab1

# --------------------------------------------------------------------------
# Routes
# --------------------------------------------------------------------------
# Each route registers a subdomain on the server. Names must be unique
# ACROSS ALL CONNECTED CLIENTS — the server rejects collisions silently
# (the loser stays in `etunl list` but never serves traffic).

routes:

  # ----- HTTP, no auth -------------------------------------------------
  # Reachable at https://app.example.com (via tunnel) and
  # http://app.<your-local-domain> (via local proxy on this machine,
  # assuming /etc/hosts is set up).
  - name: app
    type: http
    target: localhost:3030

  - name: server
    type: http
    target: localhost:3000

  # ----- HTTP with bearer token auth (Form A) --------------------------
  # Enforced at the public server AND the local proxy.
  # Use for API endpoints accessed by other code.
  # - name: api
  #   type: http
  #   target: localhost:8080
  #   auth:
  #     bearer: "long-random-shared-secret"

  # ----- HTTP with custom-header auth (Form B) -------------------------
  # Enforced at the public server AND the local proxy.
  # Use when the upstream / convention requires a specific header name.
  # - name: webhook
  #   type: http
  #   target: localhost:9000
  #   auth:
  #     header: "X-API-Key"
  #     value: "long-random-shared-secret"

  # ----- HTTP with browser session auth (Form C) -----------------------
  # Enforced ONLY at the public server. The local proxy on this machine
  # leaves the route open (cookies wouldn't resolve to a local hostname).
  # Use for human-facing apps.
  # Endpoints injected: /___login___ and /___logout___
  # - name: admin
  #   type: http
  #   target: localhost:8080
  #   auth:
  #     users:
  #       - user: ilya
  #         password: "change-me-and-rotate-session_secret-if-leaked"

  # ----- TCP route -----------------------------------------------------
  # Server allocates a port from `tcp_port_range` (deterministic hash of
  # the name; collisions linear-scan). Read the actual server port from
  # `curl <server>/health` → tcp_ports.<name>.
  #
  # `local_port` (optional) tells the client to also listen on
  # 127.0.0.1:<local_port> for direct same-machine access — no tunnel hop.
  - name: db1
    type: tcp
    target: localhost:5432
    local_port: 15432

  - name: db2
    type: tcp
    target: localhost:5433
    local_port: 15433
